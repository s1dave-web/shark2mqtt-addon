name: Shark2MQTT (s1dave)
version: "1.7.0-s3"
slug: shark2mqtt_s1dave
description: Shark2MQTT fork with an app-style live map, readable sensors and app settings. Run instead of Shark2MQTT, not alongside it.
url: https://github.com/s1dave-web/shark2mqtt-addon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
apparmor: true
backup: hot
hassio_api: true
services:
  - mqtt:need
options:
  shark_username: null
  shark_password: null
  shark_region: us
  shark_household_id: ""
  use_supervisor_mqtt_service: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_prefix: shark2mqtt
  poll_interval: 300
  poll_interval_active: 20
  log_level: INFO
  ayla_merge: false
  map_image: true
  map_show_scan: false
  browser_login: true
  pause_operating_mode: 1
  map_style: app
  map_log_position: false
  map_entity: camera
schema:
  shark_username: email
  shark_password: password
  shark_region: list(us|eu)
  shark_household_id: str?
  use_supervisor_mqtt_service: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str
  poll_interval: int(10,3600)
  poll_interval_active: int(5,300)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  ayla_merge: bool
  map_image: bool
  map_show_scan: bool
  browser_login: bool
  pause_operating_mode: int(0,1)
  map_style: list(classic|app)
  map_log_position: bool
  map_entity: list(image|camera)
